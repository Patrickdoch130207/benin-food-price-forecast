name: Réentraînement Automatique Mensuel des Modèles

on:
  schedule:
    # Déclenchement automatique le 1er de chaque mois à 04:00 UTC
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forcer la mise en production du modèle même sans amélioration'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Exécuter sans modifier les modèles en service (--dry-run)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  retrain:
    name: Pipeline de réentraînement et validation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécution des tests de non-régression
        run: |
          pytest tests/ -v

      - name: Exécution du réentraînement
        run: |
          CMD="python scripts/retrain.py"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            CMD="$CMD --dry-run"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            CMD="$CMD --force"
          fi
          echo "Exécution : $CMD"
          eval $CMD

      # NOTE IMPORTANTE SUR LA TAILLE DES MODÈLES :
      # Les artefacts .joblib sont compressés (niveau 3) et mesurent moins de 1 Mo chacun.
      # Le modèle SARIMA historique est maintenu sous 36 Mo.
      # L'ensemble reste strictement sous la limite GitHub de 100 Mo par fichier.
      - name: Détection des changements et commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/*.joblib models/metadata.json models/params.json models/retrain_log.jsonl data/prix_propres.parquet data/features.parquet
          if git diff --staged --quiet; then
            echo "Aucun changement sur les modèles (modèle en service conservé)."
          else
            VERSION=$(python -c "import json; print(json.load(open('models/metadata.json')).get('version', 'update'))")
            git commit -m "chore(mlops): mise à jour automatique des modèles v$VERSION [skip ci]"
            git push origin main
          fi

